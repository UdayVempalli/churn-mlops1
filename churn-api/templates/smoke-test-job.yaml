apiVersion: batch/v1
kind: Job
metadata:
  name: churn-api-smoke-test
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: busybox
          command:
            - wget
            - -q
            - -O-
            - http://churn-api-service/health